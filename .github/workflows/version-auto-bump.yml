name: auto-bump-version

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [dev]

jobs:
  auto-version-bump:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 🛠 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 📦 Install deps
        run: npm ci

      - name: 🔍 Get versions
        id: versions
        run: |
          PR_VERSION=$(jq -r .version package.json)
          echo "pr_version=$PR_VERSION" >> $GITHUB_OUTPUT

          git fetch origin dev
          DEV_VERSION=$(git show origin/dev:package.json | jq -r .version)
          echo "dev_version=$DEV_VERSION" >> $GITHUB_OUTPUT

      - name: 🔁 Compare and bump if needed
        run: |
          parse_version() {
            IFS='.' read -r MAJ MIN PATCH <<< "$1"
            echo "$MAJ" "$MIN" "$PATCH"
          }

          PR="${{ steps.versions.outputs.pr_version }}"
          DEV="${{ steps.versions.outputs.dev_version }}"

          read PR_MAJ PR_MIN PR_PATCH <<< "$(parse_version "$PR")"
          read DEV_MAJ DEV_MIN DEV_PATCH <<< "$(parse_version "$DEV")"

          echo "🔍 PR version:  $PR_MAJ.$PR_MIN.$PR_PATCH"
          echo "🔍 Dev version: $DEV_MAJ.$DEV_MIN.$DEV_PATCH"

          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git checkout ${{ github.head_ref }}

          if [ "$PR_MAJ" -lt "$DEV_MAJ" ] || { [ "$PR_MAJ" -eq "$DEV_MAJ" ] && [ "$PR_MIN" -lt "$DEV_MIN" ]; }; then
            echo "⚠️ PR version is behind in major/minor. Aligning to dev and patch bump..."
            npm version "$DEV_MAJ.$DEV_MIN.0" --no-git-tag-version
            npm version patch --no-git-tag-version
            git add package.json package-lock.json
            git commit -m "chore(release): align with dev and bump"
            git push
          elif [ "$PR_MAJ" -eq "$DEV_MAJ" ] && [ "$PR_MIN" -eq "$DEV_MIN" ] && [ "$PR_PATCH" -le "$DEV_PATCH" ]; then
            echo "🔁 Same minor. Patch bump needed..."
            npm version patch --no-git-tag-version
            git add package.json package-lock.json
            git commit -m "chore(release): bump patch"
            git push
          else
            echo "✅ PR version is ahead. No bump needed."
          fi
