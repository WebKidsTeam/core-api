name: validate

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v3

      - name: ⏭ Skip for version bump PRs
        run: |
          echo "🧠 PR title: ${{ github.event.pull_request.title }}"
          echo "🧠 Branch: ${{ github.head_ref }}"

          if [[ "${{ github.head_ref }}" =~ ^version/bump- ]] || [[ "${{ github.event.pull_request.title }}" =~ ^chore\(WK-00\): ]]; then
            echo "✅ Skipping validation for version bump PR"
            exit 0
          fi

      - name: 🔍 Check branch name format
        run: |
          BRANCH="${{ github.head_ref }}"
          echo "Checking branch name: $BRANCH"
          if ! [[ "$BRANCH" =~ ^(feat|fix|chore|refactor|test|docs|ci|build)/WK-[0-9]+/.+ ]]; then
            echo "❌ Invalid branch name!"
            echo "✅ Expected: feat/WK-123/short-description"
            exit 1
          fi

      - name: 🔍 Check PR title format
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          echo "Checking PR title: $TITLE"
          if ! [[ "$TITLE" =~ ^(feat|fix|chore|refactor|test|docs|ci|build)\(WK-[0-9]+\):\ .+ ]]; then
            echo "❌ Invalid PR title!"
            echo "✅ Expected: feat(WK-123): short description"
            exit 1
          fi

      - name: 🛠 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧹 Run linter
        run: npm run lint

      - name: 🏗 Run build
        run: npm run build
