name: validate

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: ⏭ Skip for version bump PRs
        run: |
          echo "🧠 PR title: ${{ github.event.pull_request.title }}"
          echo "🧠 Branch: ${{ github.head_ref }}"

          if [[ "${{ github.head_ref }}" =~ ^version/bump- ]] || [[ "${{ github.event.pull_request.title }}" =~ ^chore\(WK-00\): ]]; then
            echo "✅ Skipping validation for version bump PR"
            exit 0
          fi

      - name: 🔍 Check branch name format
        run: |
          BRANCH="${{ github.head_ref }}"
          echo "Checking branch name: $BRANCH"
          if ! [[ "$BRANCH" =~ ^(feat|fix|chore|refactor|test|docs|ci|build)/WK-[0-9]+/.+ ]]; then
            echo "❌ Invalid branch name!"
            echo "✅ Expected: feat/WK-123/short-description"
            exit 1
          fi

      - name: 🔍 Check PR title format
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          echo "Checking PR title: $TITLE"
          if ! [[ "$TITLE" =~ ^(feat|fix|chore|refactor|test|docs|ci|build)\(WK-[0-9]+\):\ .+ ]]; then
            echo "❌ Invalid PR title!"
            echo "✅ Expected: feat(WK-123): short description"
            exit 1
          fi

      - name: 🛠 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧹 Run linter
        run: npm run lint

      - name: 🏗 Run build
        run: npm run build

      - name: 🔁 Compare version with dev and bump if needed
        run: |
          parse_version() {
            IFS='.' read -r MAJ MIN PATCH <<< "$1"
            echo "$MAJ" "$MIN" "$PATCH"
          }

          PR_VERSION=$(jq -r .version package.json)

          git fetch origin dev
          DEV_VERSION=$(git show origin/dev:package.json | jq -r .version)

          read PR_MAJ PR_MIN PR_PATCH <<< "$(parse_version "$PR_VERSION")"
          read DEV_MAJ DEV_MIN DEV_PATCH <<< "$(parse_version "$DEV_VERSION")"

          echo "🔍 PR version:  $PR_MAJ.$PR_MIN.$PR_PATCH"
          echo "🔍 Dev version: $DEV_MAJ.$DEV_MIN.$DEV_PATCH"

          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

          if [ "$PR_MAJ" -lt "$DEV_MAJ" ] || { [ "$PR_MAJ" -eq "$DEV_MAJ" ] && [ "$PR_MIN" -lt "$DEV_MIN" ]; }; then
            echo "⚠️ PR version is behind. Aligning to dev and patch bump..."
            npm version "$DEV_MAJ.$DEV_MIN.0" --no-git-tag-version
            npm version patch --no-git-tag-version
          elif [ "$PR_MAJ" -eq "$DEV_MAJ" ] && [ "$PR_MIN" -eq "$DEV_MIN" ] && [ "$PR_PATCH" -le "$DEV_PATCH" ]; then
            echo "🔁 Same minor. Patch bump needed..."
            npm version patch --no-git-tag-version
          else
            echo "✅ PR version is ahead. No bump needed."
            exit 0
          fi

          NEW_VERSION=$(jq -r .version package.json)
          echo "📦 New version: $NEW_VERSION"

          git add package.json package-lock.json
          git commit -m "chore(WK-00): version $NEW_VERSION"
          git push
