name: Bump version on PR merge

on:
  pull_request:
    types: [closed]
    branches: [dev]

jobs:
  bump-version:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Configure git author
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Extract current version
        id: version
        run: echo "tag=v$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        run: |
          if git rev-parse ${{ steps.version.outputs.tag }} >/dev/null 2>&1; then
            echo "Tag ${{ steps.version.outputs.tag }} already exists. Skipping release."
            exit 0
          fi

      - name: Bump version (patch)
        run: npx standard-version --release-as patch

      - name: Get new version
        id: new_version
        run: echo "VERSION=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request with version bump
        id: create_pr
        uses: peter-evans/create-pull-request@v5
        with:
          branch: version/bump-${{ steps.new_version.outputs.VERSION }}
          title: 'chore(WK-00): ${{ steps.new_version.outputs.VERSION }}'
          body: 'This PR bumps the version to `${{ steps.new_version.outputs.VERSION }}`'
          commit-message: 'chore(WK-00): ${{ steps.new_version.outputs.VERSION }}'
          base: dev

      - name: Enable auto-merge for version bump PR
        uses: peter-evans/enable-pull-request-automerge@v2
        with:
          pull-request-number: ${{ steps.create_pr.outputs.pull-request-number }}
          merge-method: squash
