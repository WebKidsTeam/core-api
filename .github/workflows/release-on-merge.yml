name: Bump version on PR merge

on:
  pull_request:
    types: [closed]
    branches: [dev]

jobs:
  bump-version:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Configure git author
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Extract current version
        id: version
        run: echo "tag=v$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        run: |
          if git rev-parse ${{ steps.version.outputs.tag }} >/dev/null 2>&1; then
            echo "Tag ${{ steps.version.outputs.tag }} already exists. Skipping release."
            exit 0
          fi

      - name: Bump version (patch)
        run: npx standard-version --release-as patch

      - name: Create Pull Request with version bump
        uses: peter-evans/create-pull-request@v5
        with:
          branch: version/bump-${{ github.run_number }}
          title: 'chore(release): bump version'
          body: 'This PR was automatically generated after a merged PR in dev.'
          commit-message: 'chore(release): bump version'
          base: dev
